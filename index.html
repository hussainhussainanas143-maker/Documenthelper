<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DocumentReader AI</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
<h1>DocumentReader AI</h1>
<p class="sub">Drop in a document and get its key information, summary and keywords instantly. Everything runs in your browser; your files are never uploaded.</p>

<div class="card">
  <div id="drop" tabindex="0">Drag a file here or click to choose<br><small>.pdf, .txt, .md, .csv, .json</small></div>
  <input id="file" type="file" accept=".pdf,.txt,.md,.csv,.json,text/*" hidden>
  <textarea id="text" placeholder="…or paste document text here"></textarea>
  <button id="go">Extract information</button>
  <button id="sample" class="alt">Try a sample</button>
  <button id="clear" class="alt">Clear</button>
  <div id="status" role="status"></div>
</div>

<div id="out" hidden>
  <div class="card"><div class="stats" id="stats"></div></div>
  <div class="card"><h2>Summary</h2><div id="summary"></div></div>
  <div class="card"><h2>Top keywords</h2><div id="keywords"></div></div>
  <div class="grid" id="fields"></div>
  <div class="card"><h2>JSON output</h2><pre id="json"></pre><button id="copy">Copy JSON</button></div>
</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
